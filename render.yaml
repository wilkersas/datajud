services:
  - type: web
    name: datajud-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_PATH_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.13.0
